<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMO geometry review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#594568}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';
import {createBMO} from '/src/scene.js';
const scene=new T.Scene();scene.background=new T.Color('#594568');
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,60);
const query=new URLSearchParams(location.search),yaw=Number(query.get('yaw')||0)*Math.PI/180,pitch=Number(query.get('pitch')||8)*Math.PI/180;
const distance=7.7;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,1.8+Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(0,1.8,.2);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;document.body.append(renderer.domElement);
const model=createBMO(scene);renderer.render(scene,camera);window.modelAudit=model.audit();document.body.dataset.ready='true';
</script></body></html>
